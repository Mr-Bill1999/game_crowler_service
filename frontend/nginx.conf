server {
  listen 80;
  root /usr/share/nginx/html;

  # Text and the 3D models compress 3-6x; .glb is served as application/octet-stream.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml application/octet-stream;

  # Resolve the api container on every request through Docker's DNS: a restarted api gets a new address,
  # and a name resolved once at startup would answer 502 until nginx itself restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:8000;

  location /api/events/stream {
    proxy_pass $api;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  location /api/ { proxy_pass $api; proxy_set_header X-Real-IP $remote_addr; }
  # Hashed bundles never change; the models in /hero are refreshed by name, so a shorter cache.
  location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
  location /hero/ { try_files $uri =404; expires 7d; }
  location / { try_files $uri /index.html; }
}
