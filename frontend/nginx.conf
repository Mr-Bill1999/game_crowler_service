server {
  listen 80;
  root /usr/share/nginx/html;

  # Resolve the api container on every request through Docker's DNS: a restarted api gets a new address,
  # and a name resolved once at startup would answer 502 until nginx itself restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:8000;

  location /api/events/stream {
    proxy_pass $api;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  location /api/ { proxy_pass $api; proxy_set_header X-Real-IP $remote_addr; }
  location / { try_files $uri /index.html; }
}
