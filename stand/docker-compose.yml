# Test stand: the full stack as its own Compose project, apart from the working service.
# Own ports, database and Redis; external calls go through tapes (GA_TAPE_MODE), the clock is frozen
# (GA_FROZEN_NOW) and cron is off. Driven by stand/stand.sh, see stand/README.md.
name: ga-stand

x-backend: &backend
  build: ../backend
  env_file: ../backend/.env  # API keys; everything below overrides it
  environment:
    GA_DATABASE_URL: postgresql+asyncpg://ga:ga@postgres:5432/gameanalytics
    GA_REDIS_URL: redis://redis:6379/0
    GA_TAPE_MODE: ${GA_TAPE_MODE:-replay}
    GA_TAPE_DIR: /tapes
    GA_FROZEN_NOW: ${GA_FROZEN_NOW:-}
    GA_CRON_ENABLED: "false"
  volumes: ["./tapes:/tapes"]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_started}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: ga, POSTGRES_PASSWORD: ga, POSTGRES_DB: gameanalytics}
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ga -d gameanalytics"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]

  api:
    <<: *backend
    ports: ["8001:8000"]

  worker:
    <<: *backend
    command: ["arq", "app.pipeline.tasks.WorkerSettings"]

  web:
    build: ../frontend
    ports: ["8081:80"]
    depends_on: [api]

volumes:
  pgdata:
